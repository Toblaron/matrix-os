name: Build Matrix OS ISO

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO inside Arch Linux container
        run: |
          docker run --privileged --rm -v "$PWD":/workspace -w /workspace archlinux:latest bash -c "
            set -e
            pacman -Syu --noconfirm archiso
            mkdir -p dist
            mkarchiso -v -w /tmp/archiso-work -o dist .
          "

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: matrix-os-x86_64
          path: dist/*.iso

name: Build Matrix OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO inside Arch Linux Container
        run: |
          docker run --privileged --rm -v "$PWD":/workspace -w /workspace archlinux:latest bash -c "
            pacman -Syu --noconfirm archiso git
            chmod +x airootfs/usr/local/bin/matrix-recon
            mkdir -p dist
            mkarchiso -v -w /tmp/archiso-work -o dist .
          "

      - name: Upload Bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: matrix-os-x86_64
          path: dist/*.iso

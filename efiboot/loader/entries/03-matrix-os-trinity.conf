title    Matrix OS - Trinity (runs from RAM, leaves no trace)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash systemd.firstboot=off nvidia_drm.modeset=1 cow_spacesize=50% copytoram=y %KERNEL_PARAMS%

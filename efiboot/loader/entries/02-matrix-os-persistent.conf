title    Matrix OS - persistent (keeps changes on USB)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash nvidia_drm.modeset=1 cow_spacesize=50% cow_label=MATRIX_PERSIST %KERNEL_PARAMS%

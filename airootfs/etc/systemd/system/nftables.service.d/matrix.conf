# Keep the unit active after loading the rules (Arch ships it as a plain
# oneshot) and tell the HUD the strict ruleset is up (CONNECTION: SECURED)
[Service]
RemainAfterExit=yes
ExecStartPost=/usr/bin/mkdir -p /run/matrix
ExecStartPost=/usr/bin/touch /run/matrix/firewall-strict
ExecStopPost=/usr/bin/rm -f /run/matrix/firewall-strict

[core]
plugins = alpha animate autostart blur command cube decay exp fire vswitch zoom window-rules place workspace-names grid core
close_top_view = <super> KEY_Q
vwidth = 4
vheight = 1

[cube]
activate = <super> BTN_LEFT
rotate_left = <super> <ctrl> KEY_LEFT
rotate_right = <super> <ctrl> KEY_RIGHT
zoom = 0.50
background_color = 0.0 0.05 0.0 1.0
opacity = 0.60
draw_wireframe = true
wireframe_color = 0.0 1.0 0.0 0.5

[blur]
method = kawase
blur_by_default = all
kawase_offset = 5.0
kawase_degrade = 1
intensity = 0.70

[command]
binding_osint = <super> KEY_O
command_osint = kitty --class "matrix_osint" -e /usr/local/bin/matrix-recon

[window-rules]
rule_kitty = on created if app_id is "kitty" then set alpha 0.85
rule_osint = on created if app_id is "matrix_osint" then set alpha 0.90

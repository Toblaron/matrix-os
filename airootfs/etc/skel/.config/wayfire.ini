# Matrix OS - Wayfire profile
# Wayfire reloads this file automatically when it changes.

[core]
plugins = alpha animate autostart blur command cube decoration expo fast-switcher grid move place resize switcher vswitch window-rules wm-actions wobbly zoom
preferred_decoration_mode = server
close_top_view = <super> KEY_Q | <alt> KEY_F4
vwidth = 4
vheight = 1
xwayland = true

[input]
xkb_layout = us
cursor_theme = default
cursor_size = 24

[autostart]
autostart_wf_shell = false
hud = matrix-hud
bar = waybar
layout = matrix-layout

# ---------------------------------------------------------------- 3D workspace cube
[cube]
activate = <super> BTN_LEFT
rotate_left = <super> <ctrl> KEY_LEFT | <super> <ctrl> KEY_H
rotate_right = <super> <ctrl> KEY_RIGHT | <super> <ctrl> KEY_L
background = 0.0 0.03 0.01 1.0
background_mode = simple
deform = 0
light = true
zoom = 0.15
speed_zoom = 0.07
speed_spin_horiz = 0.02
speed_spin_vert = 0.02
initial_animation = 450

[vswitch]
binding_left = <super> KEY_LEFT
binding_right = <super> KEY_RIGHT
with_win_left = <super> <shift> KEY_LEFT
with_win_right = <super> <shift> KEY_RIGHT
duration = 350

[expo]
toggle = <super> KEY_TAB
background = 0.0 0.03 0.01 1.0
offset = 12

# ---------------------------------------------------------------- look
[decoration]
active_color = 0.24 1.0 0.45 0.85
inactive_color = 0.06 0.30 0.14 0.70
border_size = 2
title_height = 22
font = FiraCode Nerd Font
button_order = minimize maximize close

[blur]
method = kawase
blur_by_default = type is "toplevel"
kawase_offset = 4.0
kawase_degrade = 2
kawase_iterations = 3

[animate]
open_animation = zoom
close_animation = fire
duration = 300
fire_color = 0.24 1.0 0.45 1.0
fire_particles = 1500
fire_particle_size = 12.0
random_fire_color = false

[wobbly]
friction = 3.0
spring_k = 8.0

[place]
mode = center

# ---------------------------------------------------------------- bindings
[command]
binding_terminal = <super> KEY_ENTER
command_terminal = kitty
binding_launcher = <super> KEY_SPACE
command_launcher = fuzzel
binding_osint = <super> KEY_O
command_osint = kitty --class matrix_osint -e matrix-recon
binding_rain = <super> KEY_M
command_rain = kitty --class matrix_rain -e cmatrix -b -u 4 -C green
binding_layout = <super> <shift> KEY_R
command_layout = matrix-layout --reset
binding_power = <super> KEY_ESC
command_power = matrix-power
binding_volup = KEY_VOLUMEUP
command_volup = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_volup = KEY_VOLUMEUP
binding_voldown = KEY_VOLUMEDOWN
command_voldown = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
repeatable_binding_voldown = KEY_VOLUMEDOWN
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_always_on_top = <super> KEY_T

[grid]
slot_l = <super> <alt> KEY_LEFT
slot_r = <super> <alt> KEY_RIGHT
slot_c = <super> <alt> KEY_UP

[fast-switcher]
activate = <alt> KEY_TAB

[zoom]
modifier = <super>

# ---------------------------------------------------------------- window rules
[window-rules]
rule_kitty = on created if app_id is "kitty" then set alpha 0.88
rule_osint = on created if app_id is "matrix_osint" then set alpha 0.92
# >>> matrix-layout (generated by matrix-layout for the current resolution)
rule_rain_move = on created if app_id is "matrix_rain" then move 48 72
rule_rain_size = on created if app_id is "matrix_rain" then resize 787 537
rule_fetch_move = on created if app_id is "matrix_fetch" then move 624 318
rule_fetch_size = on created if app_id is "matrix_fetch" then resize 778 467
rule_viz_move = on created if app_id is "matrix_viz" then move 1436 320
rule_viz_size = on created if app_id is "matrix_viz" then resize 447 216
rule_term_move = on created if app_id is "matrix_term" then move 1436 554
rule_term_size = on created if app_id is "matrix_term" then resize 447 374
# <<< matrix-layout

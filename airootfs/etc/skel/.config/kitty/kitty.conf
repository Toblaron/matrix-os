font_family      FiraCode Nerd Font
font_size        11.5
disable_ligatures never

background            #020a05
foreground            #3dff74
selection_background  #1f8f45
selection_foreground  #020a05
cursor                #8dffb0
cursor_shape          block
cursor_blink_interval 0.6
url_color             #8dffb0

background_opacity 0.72
dynamic_background_opacity yes
window_padding_width 10
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no

tab_bar_style      powerline
active_tab_background   #3dff74
active_tab_foreground   #020a05
inactive_tab_background #062b14
inactive_tab_foreground #3dff74

# all-green palette: what fastfetch's colour blocks and ls colours draw from
color0  #000000

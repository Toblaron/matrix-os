# Matrix OS
set -g mouse on
set -g base-index 1
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g status-position bottom
set -g status-style "bg=#07140b,fg=#3dff74"
set -g status-left "#[bg=#3dff74,fg=#020a05,bold] #S #[default] "
set -g status-right "#[fg=#2f6b45]%H:%M #[bg=#1f8f45,fg=#020a05] #h "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#1f8f45,fg=#020a05,bold] #I:#W "
set -g pane-border-style "fg=#0f3a1f"
set -g pane-active-border-style "fg=#3dff74"
set -g message-style "bg=#07140b,fg=#3dff74"
set -g mode-style "bg=#3dff74,fg=#020a05"

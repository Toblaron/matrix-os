#!/usr/bin/nft -f
# Matrix OS firewall: nothing gets in unless we asked for it.
# The "dropped" counter feeds the red glyphs in the HUD rain.
flush ruleset

table inet matrix {
  counter dropped {}

  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid counter name dropped drop
    iifname "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp sport 67 udp dport 68 accept comment "DHCPv4"
    udp sport 547 udp dport 546 accept comment "DHCPv6"
    counter name dropped drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

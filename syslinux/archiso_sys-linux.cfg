LABEL arch
TEXT HELP
Boot the Matrix OS live desktop.
ENDTEXT
MENU LABEL Matrix OS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash systemd.firstboot=off nvidia_drm.modeset=1 cow_spacesize=50%  %KERNEL_PARAMS%

LABEL persist
TEXT HELP
Keep changes on the USB stick (run matrix-persist first).
ENDTEXT
MENU LABEL Matrix OS - persistent
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash systemd.firstboot=off nvidia_drm.modeset=1 cow_spacesize=50% cow_label=MATRIX_PERSIST %KERNEL_PARAMS%

LABEL trinity
TEXT HELP
Copy the system to RAM; nothing is written anywhere.
ENDTEXT
MENU LABEL Matrix OS - Trinity (RAM only)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash systemd.firstboot=off nvidia_drm.modeset=1 cow_spacesize=50% copytoram=y %KERNEL_PARAMS%

LABEL bluepill
TEXT HELP
Calm desktop without rain or effects.
ENDTEXT
MENU LABEL Matrix OS - blue pill
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash systemd.firstboot=off nvidia_drm.modeset=1 cow_spacesize=50% matrix.mode=blue %KERNEL_PARAMS%
